name: Build Android Release APK

on:
  push:
    branches:
      - master
      - main
    paths:
      - "IMEService/**"
      - "DroidDLNA/**"
      - "ijkplayer/**"
      - "thunder/**"
      - "AdbLib/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "project.properties"
      - "proguard-project.txt"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tvremoteime-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon :IMEService:clean :IMEService:assembleRelease

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK_PATH=$(find IMEService/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMEService-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-main
          name: TVRemoteIME CI Build
          prerelease: true
          make_latest: false
          body: |
            Auto-built from `${{ github.sha }}`.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            ${{ steps.apk.outputs.path }}
